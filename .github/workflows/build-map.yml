name: Build the Dubai map
# builds data/world.json and the 500 m tile packs from OpenStreetMap for the phases enabled in tools/phases.json
# source: the Geofabrik GCC extract, cut to the enabled phases (plus a margin) with osmium
on:
  push:
    branches: [main]
    paths: ['tools/build_dubai.py', 'tools/pbf_to_json.py', 'tools/build_s2.py', 'tools/worldcover_trees.py', 'tools/phases.json', '.github/workflows/build-map.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-map-pbf
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install shapely==2.0.6 osmium overturemaps numpy rasterio pyproj pillow
      - name: Download OpenStreetMap (GCC states, from Geofabrik)
        run: |
          mkdir -p .cache
          for i in 1 2 3 4 5; do
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 15 -o .cache/gcc.osm.pbf https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf && osmium fileinfo .cache/gcc.osm.pbf > /dev/null && break
            echo "download failed, trying again"; rm -f .cache/gcc.osm.pbf; sleep 30
          done
          test -s .cache/gcc.osm.pbf
          ls -la .cache
      - name: Cut out the enabled phases
        run: |
          BB=$(python -c "import json;p=[x['bbox'] for x in json.load(open('tools/phases.json'))['phases'] if x.get('enabled')];m=0.02;print('%f,%f,%f,%f'%(min(b[0] for b in p)-m,min(b[1] for b in p)-m,max(b[2] for b in p)+m,max(b[3] for b in p)+m))")
          echo "bbox $BB"
          osmium extract -b "$BB" -s smart -S types=multipolygon,boundary,route .cache/gcc.osm.pbf -o .cache/phase.osm.pbf --overwrite
          python tools/pbf_to_json.py .cache/phase.osm.pbf .cache/phase.json
      - name: Download Overture Maps buildings (fills in homes OpenStreetMap is missing)
        continue-on-error: true
        run: |
          BB=$(python -c "import json;p=[x['bbox'] for x in json.load(open('tools/phases.json'))['phases'] if x.get('enabled')];print('%f,%f,%f,%f'%(min(b[0] for b in p),min(b[1] for b in p),max(b[2] for b in p),max(b[3] for b in p)))")
          overturemaps download --bbox=$BB -f geojson --type=building -o .cache/overture_buildings.geojson
          ls -la .cache
      - name: Trees from ESA WorldCover (satellite land cover)
        continue-on-error: true
        run: python tools/worldcover_trees.py .cache/trees.json
      - run: python tools/build_dubai.py --out data --osm-json .cache/phase.json --overture .cache/overture_buildings.geojson --trees .cache/trees.json
      - name: Ground imagery from Sentinel-2
        continue-on-error: true
        run: python tools/build_s2.py --data data
      - name: Commit the map
        run: |
          git config user.name "Hassan Ali"
          git config user.email "hassanaliarshad110@users.noreply.github.com"
          git add -A data/world.json data/build-report.json data/search.json data/biz.json data/p data/s2
          git diff --cached --quiet || (git commit -qm "Dubai map: rebuild tiles from OpenStreetMap" && git pull -q --rebase -X theirs && git push -q)
